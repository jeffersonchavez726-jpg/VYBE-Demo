<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c12"><title>VYBE 3.0 — Android prototype</title>
<style>
:root{color-scheme:dark;--bg:#0b0c12;--surface:#141620;--surface2:#1c1f2c;--text:#f7f8fc;--muted:#9b9fb2;--line:#2b2e3e;--lime:#c2ff63;--cyan:#63f2d5;--pink:#ff70c8;--purple:#a98bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{max-width:1120px;min-height:100dvh;margin:auto;background:radial-gradient(ellipse at 100% 0%,#19332d 0,transparent 25%),radial-gradient(ellipse at 0% 0%,#2b1d46 0,transparent 30%),var(--bg)}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0b0c12ed;border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:950;letter-spacing:-1px;white-space:nowrap}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--lime),var(--cyan));color:#10140d}.search{flex:1;min-width:40px;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:11px 12px 11px 36px;color:var(--text);outline:0}.search input:focus{border-color:var(--lime)}.search span{position:absolute;left:12px;top:10px;color:var(--muted)}.create,.btn{border-radius:12px;padding:10px 14px;font-weight:800;background:linear-gradient(110deg,var(--lime),var(--cyan));color:#10140d}.btn.secondary{background:var(--surface2);border:1px solid var(--line);color:var(--text)}main{padding:16px 14px 92px}.hero{padding:23px 20px;border:1px solid #bfff6338;border-radius:22px;background:radial-gradient(circle at 88% 20%,#c2ff6324,transparent 25%),linear-gradient(125deg,#211b38,#151823 62%,#102e2b);margin-bottom:22px;overflow:hidden}.eyebrow{font-size:10px;letter-spacing:1.7px;color:var(--lime);font-weight:900}.hero h1{font-size:clamp(29px,7vw,43px);letter-spacing:-1.6px;line-height:1.05;margin:12px 0}.hero p{color:#c2c5d5;max-width:600px;margin:0 0 17px}.heroactions{display:flex;gap:9px;flex-wrap:wrap}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:24px 0 13px}.sectionhead h2{font-size:20px;letter-spacing:-.6px;margin:0}.sectionhead p{font-size:12px;color:var(--muted);margin:4px 0 0}.eyebtn{font-size:12px;color:var(--lime);background:none}.chips{display:flex;gap:8px;overflow:auto;padding:0 0 6px;margin-bottom:13px}.chip{flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:var(--muted);font-size:12px}.chip.active{background:#c2ff6319;border-color:var(--lime);color:var(--lime)}.feed{display:grid;grid-template-columns:1fr;gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}.thumb{height:178px;position:relative;display:grid;place-items:center;overflow:hidden}.thumb:before,.thumb:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}.thumb:before{width:200px;height:200px;left:-45px;top:-80px;background:#c2ff6340}.thumb:after{width:150px;height:150px;right:-20px;bottom:-75px;background:#63f2d540}.art{font-size:65px;z-index:1;filter:drop-shadow(0 10px 15px #0007)}.tag,.duration{position:absolute;z-index:2;border-radius:7px;background:#090a11d9;padding:5px 8px;font-size:10px;font-weight:850}.tag{left:11px;top:11px}.duration{right:11px;bottom:11px}.cardbody{padding:14px}.creator{display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0b1011;flex-shrink:0}.creator strong{font-size:12px}.creator small{display:block;font-size:10px;color:var(--muted)}.card h3{font-size:16px;line-height:1.3;margin:12px 0 7px}.desc{font-size:12px;color:#c0c2d0;margin:0 0 10px}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px}.cardfoot{border-top:1px solid var(--line);padding-top:10px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}.action{background:none;color:var(--muted);font-size:12px;padding:6px 7px;border-radius:8px}.action.liked{color:var(--pink)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px}.panel h3{margin:0 0 6px;font-size:16px}.panel p{color:var(--muted);font-size:13px;margin:0 0 10px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.badge{display:inline-block;font-size:10px;border-radius:999px;padding:4px 8px;background:#c2ff6318;color:var(--lime);font-weight:800}.community-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,#352a54,#19483f);flex-shrink:0}.community-actions{display:flex;gap:8px;flex-wrap:wrap}.message{max-width:86%;padding:11px 13px;border-radius:15px;background:var(--surface2);margin:8px 0;font-size:13px}.message.mine{margin-left:auto;background:#293b2a;border:1px solid #c2ff6338}.chatbox{height:300px;overflow:auto;padding:10px;background:#0f1119;border:1px solid var(--line);border-radius:14px;margin:12px 0}.composer{display:flex;gap:8px}.composer input,.field{min-width:0;flex:1;background:#0d0f17;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);outline:0}.composer button{border-radius:12px;padding:0 15px;background:var(--lime);color:#111;font-weight:900}.livegrid{display:grid;grid-template-columns:1fr;gap:12px}.livecover{height:125px;border-radius:13px;display:grid;place-items:center;font-size:45px;background:linear-gradient(135deg,#412658,#126254);margin-bottom:12px;position:relative}.livecover:after{content:'● EN DIRECTO';position:absolute;top:9px;left:9px;background:#ff4f79;color:white;font-size:10px;font-weight:900;padding:5px 7px;border-radius:6px}.article-label{font-size:10px;letter-spacing:1px;color:var(--cyan);font-weight:900}.article-list{display:grid;gap:10px}.article{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}.article h3{margin:6px 0;font-size:16px}.article p{font-size:12px;color:var(--muted);margin:0 0 10px}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;gap:3px;padding:9px 4px calc(9px + env(safe-area-inset-bottom));background:#0b0c12f2;border-top:1px solid var(--line);backdrop-filter:blur(18px)}.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:49px;background:none;color:var(--muted);font-size:10px}.bottomnav .ico{font-size:19px}.bottomnav button.active{color:var(--lime)}.empty{padding:30px 15px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#eaffc9;color:#10140d;border-radius:12px;padding:12px 16px;font-weight:800;font-size:12px;z-index:30;max-width:90%;text-align:center;box-shadow:0 10px 30px #0007}.modalback{position:fixed;inset:0;background:#000b;z-index:40;display:grid;place-items:center;padding:15px}.modal{width:min(520px,100%);max-height:85dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}.modal h2{margin:0 0 6px}.modal p{color:var(--muted);font-size:12px}.modal label{display:block;margin:13px 0 6px;font-size:12px;color:var(--muted)}.modal input,.modal textarea,.modal select{width:100%;background:#0b0d14;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px}.modal textarea{min-height:85px;resize:vertical}.modalbuttons{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.notice{font-size:11px;color:var(--muted);line-height:1.5;margin-top:18px}.hidden{display:none!important}
@media(min-width:700px){main{padding:24px}.feed{grid-template-columns:repeat(2,minmax(0,1fr))}.livegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:190px}.bottomnav{max-width:620px;left:50%;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}.hero{padding:30px}}
</style></head><body><div class="app">
<header><div class="logo"><span class="mark">V</span>VYBE</div><label class="search"><span>⌕</span><input id="search" placeholder="Buscar videos, ideas, comunidades…" aria-label="Buscar"></label><button class="create" id="createTop">＋</button></header>
<main id="main"></main>
<nav class="bottomnav" aria-label="Navegación principal"><button class="active" data-page="feed"><span class="ico">⌂</span>Inicio</button><button data-page="learn"><span class="ico">✦</span>Ideas</button><button data-page="communities"><span class="ico">◎</span>Grupos</button><button data-page="chat"><span class="ico">▤</span>Chat</button><button data-page="live"><span class="ico">◉</span>Directos</button></nav>
<div id="modalRoot"></div></div>
<script>
const demoPosts=[
{id:1,type:'clip',cat:'Gaming',art:'🎮',color:'linear-gradient(135deg,#47306a,#1b7168)',duration:'0:42',title:'Un truco de Minecraft que parece magia',creator:'BloqueNómada',initials:'BN',views:'12.4k',desc:'Un clip rápido que después convertimos en una guía completa.',time:'hace 12 min'},
{id:2,type:'video',cat:'Ciencia',art:'🪐',color:'linear-gradient(135deg,#243a7c,#704e9a)',duration:'18:36',title:'El universo explicado sin complicarte la vida',creator:'CosmosEnClaro',initials:'CC',views:'48k',desc:'Un viaje por las ideas más grandes, explicado paso a paso.',time:'hace 1 h'},
{id:3,type:'guide',cat:'Arte',art:'🎨',color:'linear-gradient(135deg,#82456d,#352b61)',duration:'Guía · 6 min',title:'Cómo crear un personaje desde cero',creator:'luna.draws',initials:'LD',views:'8.1k',desc:'Del concepto y la paleta de color hasta los detalles finales.',time:'hace 3 h'},
{id:4,type:'video',cat:'Gaming',art:'🧱',color:'linear-gradient(135deg,#3b704b,#27364b)',duration:'27:10',title:'Construimos una ciudad entre toda la comunidad',creator:'CraftCrew',initials:'CR',views:'21k',desc:'Cada persona construyó una parte y todas las ideas se conectaron.',time:'hace 5 h'},
{id:5,type:'clip',cat:'Aprender',art:'🧠',color:'linear-gradient(135deg,#6150a4,#234c70)',duration:'0:58',title:'Un truco para entender algo difícil',creator:'IdeaEnClaro',initials:'IC',views:'7.3k',desc:'Un resumen corto conectado a una explicación más completa.',time:'hace 6 h'}];
const articles=[{id:101,title:'Minecraft: guía para empezar una base segura',tag:'VIDEO + ARTÍCULO',desc:'Materiales básicos, ubicación, iluminación y una lista de pasos para construir tu primera base.',emoji:'⛏️'},{id:102,title:'Diseño de personajes: guía colaborativa',tag:'EN EDICIÓN',desc:'Una guía que la comunidad puede mejorar con referencias, ejemplos y explicaciones.',emoji:'✏️'},{id:103,title:'Cómo distinguir una fuente fiable',tag:'CONOCIMIENTO',desc:'Preguntas rápidas para comprobar quién publica, qué evidencia aporta y cuándo se actualizó.',emoji:'🔎'}];
const groups=[{name:'Minecraft Creativo',icon:'🧱',members:'2.4k',topic:'Construcciones, semillas y proyectos colaborativos',online:128},{name:'Arte y personajes',icon:'🎨',members:'1.8k',topic:'Dibujo, diseño de OCs y procesos creativos',online:64},{name:'Ciencia sin vueltas',icon:'🪐',members:'950',topic:'Preguntas curiosas y explicaciones con fuentes',online:31}];
const lives=[{name:'Construimos una cabaña junto al lago',host:'CraftCrew',emoji:'🏡',viewers:'326 espectadores',color:'linear-gradient(135deg,#255a50,#453269)'},{name:'Dibujando personajes en directo',host:'luna.draws',emoji:'🎨',viewers:'184 espectadores',color:'linear-gradient(135deg,#6d365e,#342d70)'}];
let page='feed',filter='Todo',query='',likes=new Set(),saved=new Set(),joined=new Set(),userPosts=[],chatMessages=[{mine:false,text:'¡Bienvenidos al chat de prueba! Aquí después conectaremos mensajes reales.'},{mine:false,text:'¿Qué les gustaría crear en VYBE?'}],articleDrafts=[];
const main=document.getElementById('main'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2300)}
function heading(title,sub,action=''){return `<div class="sectionhead"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function postCard(p){return `<article class="card"><div class="thumb" style="background:${p.color}"><span class="tag">${p.type==='clip'?'CLIP':p.type==='guide'?'VIDEO + GUÍA':'VIDEO LARGO'}</span><span class="art">${p.art}</span><span class="duration">▶ ${p.duration}</span></div><div class="cardbody"><div class="creator"><div class="avatar">${esc(p.initials)}</div><div><strong>${esc(p.creator)}</strong><small>${esc(p.cat)} · ${esc(p.time)}</small></div></div><h3>${esc(p.title)}</h3><p class="desc">${esc(p.desc)}</p><div class="meta"><span>◉ ${p.views} vistas</span><span>✦ Contenido demo</span></div><div class="cardfoot"><div><button class="action ${likes.has(p.id)?'liked':''}" data-like="${p.id}">${likes.has(p.id)?'♥':'♡'} Me gusta</button><button class="action" data-comment="${p.id}">▢ Comentar</button></div><button class="action ${saved.has(p.id)?'liked':''}" data-save="${p.id}">${saved.has(p.id)?'▣ Guardado':'♧ Guardar'}</button></div></div></article>`}
function renderFeed(){let all=[...userPosts,...demoPosts];let list=all.filter(p=>(filter==='Todo'||p.type===filter||p.cat===filter)&&(!query||(p.title+' '+p.creator+' '+p.cat+' '+p.desc).toLowerCase().includes(query.toLowerCase())));main.innerHTML=`<section class="hero"><div class="eyebrow">UN SOLO LUGAR · MUCHAS FORMAS DE EXPLORAR</div><h1>Lo ves. Lo aprendes.<br>Lo construyes juntos.</h1><p>Clips, videos largos, guías colaborativas, comunidades, chat y directos conectados entre sí.</p><div class="heroactions"><button class="btn" data-go="learn">Explorar conocimiento ↗</button><button class="btn secondary" id="heroCreate">＋ Crear algo</button></div></section>${heading('En órbita ahora','Clips rápidos, videos largos y guías en un mismo feed')}<div class="chips">${['Todo','clip','video','guide','Gaming','Ciencia','Arte','Aprender'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}">${({Todo:'✦ Todo',clip:'⚡ Clips',video:'▶ Videos largos',guide:'📚 Guías'})[f]||f}</button>`).join('')}</div><div class="feed">${list.length?list.map(postCard).join(''):'<div class="empty">No encontramos publicaciones. Prueba otra búsqueda.</div>'}</div><p class="notice">Prototipo de interfaz: el contenido, los likes, comentarios y guardados son demostraciones locales; aún no hay usuarios ni servidores reales.</p>`}
function renderLearn(){let list=[...articles,...articleDrafts].filter(a=>!query||(a.title+' '+a.desc).toLowerCase().includes(query.toLowerCase()));main.innerHTML=`<section class="hero"><div class="eyebrow">CONOCIMIENTO QUE CRECE EN COMUNIDAD</div><h1>Un video puede<br>convertirse en una guía.</h1><p>Conecta clips y videos con artículos, fuentes, pasos y aportes de otras personas.</p><div class="heroactions"><button class="btn" id="newArticle">＋ Proponer una guía</button><button class="btn secondary" data-go="feed">Ver videos</button></div></section>${heading('Biblioteca colaborativa','Artículos de demostración que podrían editarse en equipo')}<div class="article-list">${list.map(a=>`<article class="article"><div class="row"><div class="community-icon">${a.emoji||'📝'}</div><div class="grow"><div class="article-label">${a.tag||'BORRADOR DE DEMO'}</div><h3>${esc(a.title)}</h3></div></div><p>${esc(a.desc)}</p><button class="btn secondary" data-read="${a.id}">Abrir guía ↗</button></article>`).join('')||'<div class="empty">No hay guías que coincidan.</div>'}</div><p class="notice">La edición compartida y las referencias reales se implementarán después de conectar una base de datos.</p>`}
function renderCommunities(){main.innerHTML=`<section class="hero"><div class="eyebrow">ENCUENTRA A TU GENTE</div><h1>Los intereses se<br>convierten en comunidad.</h1><p>Cada grupo puede reunir canales, conversaciones, videos, guías y eventos en directo.</p><button class="btn" id="newGroup">＋ Proponer comunidad</button></section>${heading('Comunidades destacadas','Entra a un espacio de prueba')}<div>${groups.map((g,i)=>`<article class="panel"><div class="row"><div class="community-icon">${g.icon}</div><div class="grow"><h3>${g.name}</h3><p>${g.topic}</p><div class="meta"><span>${g.members} miembros</span><span>● ${g.online} activos (demo)</span></div></div></div><div class="community-actions" style="margin-top:13px"><button class="btn ${joined.has(i)?'secondary':''}" data-join="${i}">${joined.has(i)?'✓ Unido (demo)':'Unirme'}</button><button class="btn secondary" data-groupchat="${i}">Ver canal de chat</button><button class="btn secondary" data-groupvideos="${i}">Videos del grupo</button></div></article>`).join('')}</div><p class="notice">Los grupos y miembros son ejemplos ficticios; unirse solo cambia la interfaz de esta demo.</p>`}
function renderChat(){main.innerHTML=`${heading('Chat de comunidad','Una conversación local de demostración')}<div class="panel"><div class="row"><div class="community-icon">💬</div><div class="grow"><h3># plaza-general</h3><p>Comparte ideas con respeto.</p></div><span class="badge">DEMO</span></div><div class="chatbox" id="chatbox">${chatMessages.map(m=>`<div class="message ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><form class="composer" id="chatForm"><input id="chatInput" maxlength="300" placeholder="Escribe un mensaje de prueba…" required><button>Enviar</button></form></div><p class="notice">No se envían mensajes a otras personas. El chat real requiere cuentas, servidor, moderación y controles de seguridad.</p>`;let box=document.getElementById('chatbox');box.scrollTop=box.scrollHeight}
function renderLive(){main.innerHTML=`<section class="hero"><div class="eyebrow">EN VIVO · APRENDE EN TIEMPO REAL</div><h1>Un directo puede<br>crear algo más grande.</h1><p>Después de los videos y las guías, la comunidad puede reunirse en eventos en directo.</p><button class="btn" id="suggestLive">＋ Proponer un directo</button></section>${heading('En directo ahora','Tarjetas de ejemplo: todavía no transmiten')}<div class="livegrid">${lives.map((l,i)=>`<article class="panel"><div class="livecover" style="background:${l.color}">${l.emoji}</div><h3>${l.name}</h3><p>${l.host} · ${l.viewers}</p><button class="btn secondary" data-watch="${i}">Ver sala de prueba</button></article>`).join('')}</div><p class="notice">Los directos reales son una fase avanzada por coste, ancho de banda, moderación y seguridad. No están activos en este prototipo.</p>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='feed')renderFeed();if(page==='learn')renderLearn();if(page==='communities')renderCommunities();if(page==='chat')renderChat();if(page==='live')renderLive()}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function modal(title,description,fields,submit){let root=document.getElementById('modalRoot');root.innerHTML=`<div class="modalback" id="backdrop"><section class="modal"><h2>${title}</h2><p>${description}</p>${fields}<div class="modalbuttons"><button class="btn secondary" id="cancel">Cancelar</button><button class="btn" id="submit">Crear demo</button></div></section></div>`;document.getElementById('cancel').onclick=()=>root.innerHTML='';document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')root.innerHTML=''};document.getElementById('submit').onclick=()=>submit(root)}
function createPost(){modal('Publicar en VYBE','La publicación solo aparecerá en este prototipo de tu sesión.',`<label>Título</label><input id="pt" maxlength="90" placeholder="¿Qué quieres compartir?"/><label>Formato</label><select id="ty"><option value="clip">Clip corto</option><option value="video">Video largo</option><option value="guide">Video + guía</option></select><label>Tema</label><select id="pc"><option>Gaming</option><option>Aprender</option><option>Arte</option><option>Ciencia</option><option>Historias</option></select><label>Descripción</label><textarea id="pd" maxlength="300" placeholder="¿Qué aprenderá o descubrirá la gente?"></textarea>`,r=>{let t=r.querySelector('#pt').value.trim();if(!t){toast('Ponle un título primero 🙂');return}let ty=r.querySelector('#ty').value,cat=r.querySelector('#pc').value;userPosts.unshift({id:Date.now(),type:ty,cat,art:ty==='clip'?'⚡':ty==='video'?'▶':'📚',color:'linear-gradient(135deg,#49306a,#145c50)',duration:ty==='clip'?'0:30':ty==='video'?'demo':'Video + guía',title:t,creator:'Tu perfil demo',initials:'TÚ',views:'0',desc:r.querySelector('#pd').value.trim()||'Publicación creada en la demostración.',time:'ahora'});r.innerHTML='';go('feed');toast('¡Publicación añadida a la demo!')})}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){go(p.dataset.page);return}let g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;renderFeed();return}let l=e.target.closest('[data-like]');if(l){let id=+l.dataset.like;likes.has(id)?likes.delete(id):likes.add(id);renderFeed();return}let s=e.target.closest('[data-save]');if(s){let id=+s.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);renderFeed();toast(saved.has(id)?'Guardado en esta demo':'Quitado de guardados');return}let c=e.target.closest('[data-comment]');if(c){modal('Comentarios de prueba','Todavía no se publicará nada en internet.',`<label>Tu comentario</label><textarea id="ct" maxlength="300" placeholder="Aporta algo útil y respetuoso"></textarea>`,r=>{let t=r.querySelector('#ct').value.trim();r.innerHTML='';toast(t?'Comentario preparado; no se envió.':'¡Listo!')});return}let j=e.target.closest('[data-join]');if(j){let i=+j.dataset.join;joined.has(i)?joined.delete(i):joined.add(i);renderCommunities();toast(joined.has(i)?'Te uniste en la demo':'Saliste del grupo demo');return}let gc=e.target.closest('[data-groupchat]');if(gc){go('chat');toast('Este canal usa el chat de demostración');return}let gv=e.target.closest('[data-groupvideos]');if(gv){filter='Todo';go('feed');toast('Videos de ejemplo de la comunidad');return}let w=e.target.closest('[data-watch]');if(w){modal('Sala de directo de prueba','Esta sala es solo una maqueta. No hay video en vivo ni transmisión real.',`<div class="livecover">${lives[+w.dataset.watch].emoji}</div><p>Chat de la sala (demo)</p>`,r=>{r.innerHTML='';toast('Sala de prueba cerrada')});return}let rd=e.target.closest('[data-read]');if(rd){let a=[...articles,...articleDrafts].find(x=>x.id==rd.dataset.read);if(a)modal(a.title,'Artículo de demostración. Más adelante tendrá contenido completo, fuentes, historial de cambios y aportaciones.',`<p>${esc(a.desc)}</p><label>Proponer una mejora</label><textarea id="editArticle" placeholder="¿Qué añadirías a esta guía?"></textarea>`,r=>{let v=r.querySelector('#editArticle').value.trim();r.innerHTML='';toast(v?'Sugerencia preparada; aún no se comparte.':'Artículo cerrado')});return}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});document.getElementById('createTop').onclick=createPost;document.getElementById('heroCreate')?.addEventListener('click',createPost);document.addEventListener('click',e=>{if(e.target.id==='heroCreate')createPost();if(e.target.id==='newArticle')modal('Proponer una guía','Convierte un tema en conocimiento que otras personas puedan ampliar.',`<label>Título</label><input id="at" maxlength="100" placeholder="Nombre de la guía"/><label>Resumen</label><textarea id="ad" maxlength="300" placeholder="¿Qué aprenderá alguien?"/>`,r=>{let title=r.querySelector('#at').value.trim();if(!title){toast('Escribe un título');return}articleDrafts.unshift({id:Date.now(),title,tag:'BORRADOR DE DEMO',desc:r.querySelector('#ad').value.trim()||'Idea propuesta para una guía colaborativa.',emoji:'📝'});r.innerHTML='';renderLearn();toast('Guía añadida a la demo')});if(e.target.id==='newGroup')modal('Proponer comunidad','En esta versión solo creamos una propuesta local.',`<label>Nombre del grupo</label><input id="gn" maxlength="60" placeholder="Ej. Fanáticos del dibujo"/><label>¿De qué tratará?</label><textarea id="gd" maxlength="200" placeholder="Temas, actividades y reglas básicas"/>`,r=>{let name=r.querySelector('#gn').value.trim();if(!name){toast('Ponle un nombre al grupo');return}groups.unshift({name,icon:'🌱',members:'1',topic:r.querySelector('#gd').value.trim()||'Nueva comunidad propuesta',online:1});r.innerHTML='';renderCommunities();toast('Comunidad añadida a la demo')});if(e.target.id==='suggestLive')modal('Proponer un directo','Esta función recoge una idea para la interfaz; no crea una transmisión.',`<label>Título del directo</label><input id="lt" maxlength="80" placeholder="¿Qué harías en vivo?"/><label>Descripción</label><textarea id="ld" maxlength="200" placeholder="Qué verá o aprenderá la gente"/>`,r=>{let t=r.querySelector('#lt').value.trim();r.innerHTML='';toast(t?'Propuesta preparada (demo)':'Propuesta cerrada')})});
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();let input=document.getElementById('chatInput'),v=input.value.trim();if(!v)return;chatMessages.push({mine:true,text:v});chatMessages.push({mine:false,text:'Mensaje guardado solo en esta demostración.'});renderChat()}});render();
</script></body></html>
